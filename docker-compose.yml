name: hyrox-shop

services:
  # MariaDB (ADR-0001). Die Daten liegen im Volume "db-data" und überleben Neustarts.
  # Zurücksetzen inkl. Beispieldaten, Konten und Bildern: docker compose down -v
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: shop
      MARIADB_USER: shop
      MARIADB_PASSWORD: shop
      # Kein festes root-Passwort im Repo (Q3, ADR-0008): MariaDB würfelt eins, das niemand braucht.
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # Das MariaDB-Image bringt dieses Skript mit: bereit, wenn Verbindungen angenommen werden.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  backend:
    build:
      context: ./backend
    image: hyrox-shop/backend:local
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mariadb://db:3306/shop
      DB_USER: shop
      DB_PASSWORD: shop
      IMAGES_DIR: /data/images
      # Admin-Passwort (ADR-0008): leer lassen → zufälliges Passwort steht beim ersten Start im Log.
      # Eigenes setzen: in einer .env-Datei (nicht im Repo) ADMIN_PASSWORD=... eintragen.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@hyrox-shop.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      # Hochgeladene Produktbilder überleben Neustarts (ADR-0007).
      - images:/data/images
    depends_on:
      db:
        # Das Backend braucht beim Start die Datenbank (Tabellen anlegen, Beispieldaten).
        condition: service_healthy
    healthcheck:
      # Das JRE-alpine-Image hat busybox wget, damit wird der echte Endpunkt geprüft.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    image: hyrox-shop/frontend:local
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        # nginx löst "backend" beim Start auf, darf also nicht zuerst hochfahren.
        condition: service_healthy

volumes:
  db-data:
  images:
