spring.application.name=shop

# MariaDB (ADR-0001). In Docker setzt docker-compose.yml die Werte per Umgebungsvariable,
# lokal (./mvnw spring-boot:run) greifen die Standardwerte nach dem Doppelpunkt.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/shop}
spring.datasource.username=${DB_USER:shop}
spring.datasource.password=${DB_PASSWORD:shop}

# Hibernate legt die Tabellen beim Start an bzw. ergänzt sie. Für Sprint 1 reicht das,
# später ersetzen wir es durch versionierte Migrationen (z. B. Flyway).
spring.jpa.hibernate.ddl-auto=update

# Datenbankzugriffe passieren nur in den Services (@Transactional), nicht beim Rendern der Antwort.
spring.jpa.open-in-view=false

# --- Sprint 2 ---

# Anmeldung per Sitzungs-Cookie (ADR-0004). SameSite=Strict: Der Browser schickt das Cookie nie bei
# Anfragen von fremden Seiten mit, das schützt vor CSRF. HttpOnly: JavaScript kommt nicht an das Cookie.
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=2h

# Admin-Zugang beim ersten Start (ADR-0008). Ohne ADMIN_PASSWORD wird ein Zufallspasswort ins Log geschrieben.
shop.admin.email=${ADMIN_EMAIL:admin@hyrox-shop.local}
shop.admin.password=${ADMIN_PASSWORD:}

# Hochgeladene Produktbilder (ADR-0007). In Docker liegt der Ordner im Volume "images".
shop.images.dir=${IMAGES_DIR:./data/images}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
