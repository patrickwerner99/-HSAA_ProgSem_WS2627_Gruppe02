spring.application.name=shop

# MariaDB (ADR-0001). In Docker setzt docker-compose.yml die Werte per Umgebungsvariable,
# lokal (./mvnw spring-boot:run) greifen die Standardwerte nach dem Doppelpunkt.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/shop}
spring.datasource.username=${DB_USER:shop}
spring.datasource.password=${DB_PASSWORD:shop}

# Hibernate legt die Tabellen beim Start an bzw. ergänzt sie. Für Sprint 1 reicht das,
# später ersetzen wir es durch versionierte Migrationen (z. B. Flyway).
spring.jpa.hibernate.ddl-auto=update

# Datenbankzugriffe passieren nur in den Services (@Transactional), nicht beim Rendern der Antwort.
spring.jpa.open-in-view=false
