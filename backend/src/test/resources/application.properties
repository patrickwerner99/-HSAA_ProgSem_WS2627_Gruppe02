spring.application.name=shop

# Tests laufen gegen eine H2-Datenbank im Arbeitsspeicher (im MariaDB-Kompatibilitätsmodus),
# damit "mvn package" im Docker-Build keine laufende MariaDB braucht.
spring.datasource.url=jdbc:h2:mem:shop;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
